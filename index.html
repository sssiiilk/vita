<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b7eaf6" />
    <meta name="description" content="Краузе Виталина — грумер. Запись в Telegram, WhatsApp, MAX и ВКонтакте." />
    <title>Краузе Виталина — грумер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23ff2e8b'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23b7eaf6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <img src="bg.png" alt="" />
    </div>

    <main class="card">
      <p class="eyebrow">грумер</p>
      <h1 class="name">
        Краузе<br />
        Виталина
      </h1>
      <p class="tagline">Стрижка, которая<br />подчёркивает характер</p>

      <!-- Замените href="#..." на настоящие ссылки -->
      <nav class="links" aria-label="Социальные сети">
        <a class="btn" href="#telegram" data-network="telegram">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M21.5 3.4 18.7 20c-.2 1-1.3 1.4-2.2.8l-4.4-3.3-2.1 2.1c-.2.2-.5.4-.9.4l.3-4.5 8.2-7.4c.4-.3-.1-.5-.6-.2l-10.1 6.4-4.4-1.4c-1-.3-1-1 .2-1.5L20 2.7c.8-.3 1.6.2 1.5.7Z"
              />
            </svg>
          </span>
          <span class="btn-text">
            <span class="btn-title">Telegram</span>
            <span class="btn-sub">написать в мессенджер</span>
          </span>
        </a>

        <a class="btn" href="#whatsapp" data-network="whatsapp">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M12.04 2a9.9 9.9 0 0 0-8.5 15.1L2 22l5.05-1.5A9.95 9.95 0 1 0 12.04 2Zm5.8 14.3c-.24.68-1.4 1.25-1.94 1.33-.5.07-1.13.1-1.82-.11-.42-.13-.96-.31-1.65-.61-2.9-1.26-4.78-4.18-4.93-4.38-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.27-.29.58-.36.78-.36h.56c.18 0 .42-.07.65.5.24.58.81 2 .88 2.14.07.15.12.32.02.51-.1.2-.15.32-.3.5-.14.17-.3.38-.43.51-.14.14-.29.3-.12.58.16.29.73 1.2 1.57 1.95 1.08.96 1.99 1.26 2.27 1.4.28.14.44.12.6-.07.17-.2.7-.81.89-1.09.18-.27.37-.23.62-.14.26.1 1.63.77 1.91.91.28.14.46.21.53.33.07.12.07.68-.17 1.36Z"
              />
            </svg>
          </span>
          <span class="btn-text">
            <span class="btn-title">WhatsApp</span>
            <span class="btn-sub">быстрая запись</span>
          </span>
        </a>

        <a class="btn" href="#max" data-network="max">
          <span class="icon icon-letter" aria-hidden="true">M</span>
          <span class="btn-text">
            <span class="btn-title">MAX</span>
            <span class="btn-sub">написать в Max</span>
          </span>
        </a>

        <a class="btn" href="#vk" data-network="vk">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M12.8 17.5h1.5s.4-.05.7-.37c.2-.23.2-.66.2-.66s-.03-2.02.9-2.32c.92-.3 2.1 1.95 3.35 2.81.95.66 1.67.51 1.67.51l3.36-.05s1.75-.11.92-1.49c-.07-.11-.48-1.01-2.46-2.86-2.07-1.93-1.79-1.62.7-4.96 1.52-2.03 2.13-3.27 1.94-3.8-.18-.5-1.3-.37-1.3-.37l-3.78.02s-.28-.04-.49.09c-.2.12-.33.4-.33.4s-.6 1.6-1.4 2.96c-1.68 2.87-2.36 3.02-2.63 2.84-.64-.42-.48-1.68-.48-2.58 0-2.8.42-3.97-.83-4.27-.41-.1-.72-.17-1.78-.18-1.36-.02-2.51.01-3.16.31-.44.2-.77.65-.57.67.25.03.82.15 1.12.56.39.53.38 1.72.38 1.72s.22 3.28-.52 3.69c-.51.28-1.22-.3-2.73-2.93-.77-1.35-1.36-2.84-1.36-2.84s-.11-.27-.31-.42c-.24-.18-.58-.24-.58-.24l-3.59.02s-.54.02-.74.25c-.17.21-.01.64-.01.64s2.85 6.66 6.08 10.01c2.96 3.07 6.33 2.87 6.33 2.87Z"
              />
            </svg>
          </span>
          <span class="btn-text">
            <span class="btn-title">ВКонтакте</span>
            <span class="btn-sub">профиль и отзывы</span>
          </span>
        </a>
      </nav>

      <p class="address">Запись по адресу<br /><strong>Писателя Знаменского 25/1</strong></p>
    </main>
  </body>
</html>
